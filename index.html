    function getMermaidSvg(slideId, activeStep) {
      const arr = SVG_DIAGRAMS_MAP[slideId] || SVG_DIAGRAMS_MAP["process-summary"];
      return arr[activeStep] || arr[0];
    }

    function formatTopicShort(s) {
      if (!s) return "";
      return s.topicNumber ? s.topicNumber + ". " + s.title : s.title;
    }

    function renderApp(resetScroll = false) {
      const totalSlides = SLIDES_DATA.length;
      const slide = SLIDES_DATA[currentIndex];
      const prevSlide = currentIndex > 0 ? SLIDES_DATA[currentIndex - 1] : null;
      const nextSlide = currentIndex < totalSlides - 1 ? SLIDES_DATA[currentIndex + 1] : null;

      document.getElementById("sr-announcer").textContent = `Slide ${slide.slideNumber} of ${totalSlides}: ${slide.title}. ${slide.subtitle}`;
      document.getElementById("main-slide-stage").setAttribute("aria-label", `Slide ${slide.slideNumber} of ${totalSlides}: ${slide.title}`);
      document.getElementById("drawer-toggle-btn").textContent = showSlideDrawer ? "Close All Slides" : `All Slides (${slide.slideNumber}/${totalSlides})`;
      document.getElementById("compact-indicator").textContent = `Slide ${slide.slideNumber} of ${totalSlides}`;
      const pct = Math.round(((currentIndex + 1) / totalSlides) * 100);
      const fillEl = document.getElementById("progress-bar-fill");
      if (fillEl) fillEl.style.width = pct + "%";
      const trackEl = document.getElementById("progress-bar-track");
      if (trackEl) trackEl.setAttribute("aria-valuenow", String(currentIndex + 1));

      const prevBtn = document.getElementById("prev-btn");
      const prevLabel = document.getElementById("prev-btn-label");
      prevBtn.disabled = !prevSlide;
      prevLabel.textContent = prevSlide ? "Prev: " + formatTopicShort(prevSlide) : "Previous";

      const nextBtn = document.getElementById("next-btn");
      const nextLabel = document.getElementById("next-btn-label");
      const nextIcon = document.getElementById("next-btn-icon");
      if (nextSlide) {
        nextLabel.textContent = "Next: " + formatTopicShort(nextSlide);
        nextIcon.textContent = "→";
        nextBtn.onclick = goToNext;
      } else {
        nextLabel.textContent = "Restart: 01. Before You Build";
        nextIcon.textContent = "↺";
        nextBtn.onclick = () => jumpToSlide(0);
      }

      document.getElementById("nav-intro").className = `hover:text-[#051937] transition-colors whitespace-nowrap shrink-0 cursor-pointer ${currentIndex <= 1 ? "text-[#0052CC] font-semibold underline underline-offset-4 decoration-2" : ""}`;
      document.getElementById("nav-topics").className = `hover:text-[#051937] transition-colors whitespace-nowrap shrink-0 cursor-pointer ${currentIndex >= 2 && currentIndex <= 16 ? "text-[#0052CC] font-semibold underline underline-offset-4 decoration-2" : ""}`;
      document.getElementById("nav-flow").className = `hover:text-[#051937] transition-colors whitespace-nowrap shrink-0 cursor-pointer ${currentIndex === 17 ? "text-[#0052CC] font-semibold underline underline-offset-4 decoration-2" : ""}`;
      document.getElementById("nav-check").className = `hover:text-[#051937] transition-colors whitespace-nowrap shrink-0 cursor-pointer ${currentIndex >= 18 ? "text-[#0052CC] font-semibold underline underline-offset-4 decoration-2" : ""}`;

      const drawerEl = document.getElementById("slide-drawer");
      drawerEl.classList.toggle("hidden", !showSlideDrawer);
      document.getElementById("slide-drawer-grid").innerHTML = SLIDES_DATA.map((item, idx) => `
        <button type="button" onclick="jumpToSlide(${idx})" class="p-2.5 text-left rounded-lg border transition-colors cursor-pointer ${idx === currentIndex ? "bg-[#0052CC] text-white border-[#0052CC]" : "bg-white text-[#051937] border-[#D8E3F0] hover:border-[#0052CC]"}">
          <div class="text-[11px] font-mono tabular-nums ${idx === currentIndex ? "text-[#93C5FD]" : "text-[#475569]"}">Slide ${item.slideNumber} · ${item.section}</div>
          <div class="text-xs font-semibold mt-0.5 truncate">${item.topicNumber ? item.topicNumber + ". " + item.title : item.title}</div>
        </button>
      `).join("");

      const container = document.getElementById("slide-container");
      if (slide.id === "final-checklist") {
        const checkedCount = CHECKLIST_QUESTIONS.filter(q => checkedItems[q.num]).length;
        container.innerHTML = `
          <div class="flex-1 min-h-0 flex flex-col">
            <div class="anim-slide-up-1 shrink-0 flex flex-wrap items-end justify-between gap-4 pb-3 border-b border-[#D8E3F0]">
              <div>
                <div class="text-xs font-semibold uppercase tracking-widest text-[#0052CC]">
                  ${slide.section}
                </div>
                <h1 class="mt-1 text-2xl sm:text-3xl lg:text-4xl font-semibold tracking-tight text-[#051937]">${slide.title}</h1>
                <p class="mt-0.5 text-sm sm:text-base text-[#3A3A3C]">${slide.subtitle}</p>
              </div>
              <div class="flex items-center gap-3">
                <span class="px-3 py-1.5 rounded-lg bg-[#EBF3FE] border border-[#93C5FD] text-xs sm:text-sm font-mono tabular-nums font-semibold text-[#0052CC]">${checkedCount} of 15 Confirmed</span>
                <button type="button" onclick="toggleAllChecks()" class="min-h-[38px] px-3.5 py-1.5 text-xs font-semibold text-[#051937] bg-white border border-[#CBD5E1] rounded-lg hover:bg-[#F4F8FD] hover:border-[#0052CC] transition-colors cursor-pointer">
                  ${checkedCount === 15 ? "Reset All" : "Check All 15"}
                </button>
              </div>
            </div>
            <div class="anim-slide-up-2 mt-3.5 flex-1 min-h-0 overflow-y-auto pr-1 grid grid-cols-1 md:grid-cols-3 gap-3 content-start">
              ${CHECKLIST_QUESTIONS.map(item => {
                const isDone = !!checkedItems[item.num];
                return `
                  <button type="button" role="checkbox" aria-checked="${isDone}" onclick="toggleCheck('${item.num}')" class="p-3 rounded-xl border text-left flex items-start gap-3 transition-colors cursor-pointer ${isDone ? "bg-[#EBF3FE]/85 border-[#0052CC]" : "bg-white/95 border-[#D8E3F0] hover:border-[#0052CC]/60"}">
                    <span class="mt-0.5 w-4 h-4 rounded border flex items-center justify-center text-[10px] font-bold shrink-0 ${isDone ? "bg-[#0052CC] border-[#0052CC] text-white" : "border-[#64748B] bg-[#F4F8FD]"}">${isDone ? "✓" : ""}</span>
                    <div>
                      <div class="text-xs font-semibold text-[#051937]">${item.num}. ${item.topic}</div>
                      <p class="${largeText ? "text-sm" : "text-xs"} text-[#3A3A3C] leading-snug mt-0.5">${item.question}</p>
                    </div>
                  </button>
                `;
              }).join("")}
            </div>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-12 lg:grid-rows-[minmax(0,1fr)] gap-6 lg:gap-8 items-stretch">
            <div class="lg:col-span-5 lg:h-full lg:overflow-y-auto flex flex-col pr-1">
              <div class="my-auto py-1 space-y-3.5">
                <div class="anim-slide-up-1">
                  <div class="text-xs font-semibold uppercase tracking-widest text-[#0052CC]">
                    ${slide.section}
                  </div>
                  <h1 class="mt-1.5 text-xl sm:text-2xl lg:text-[1.65rem] xl:text-[1.85rem] font-display font-medium tracking-tight text-[#051937] leading-[1.18]">
                    ${slide.topicNumber ? slide.topicNumber + ". " + slide.title : slide.title}
                  </h1>
                  <p class="mt-1.5 ${largeText ? "text-sm sm:text-base" : "text-xs sm:text-sm"} font-medium text-[#475569] leading-snug">${slide.subtitle}</p>
                </div>
                <div class="anim-slide-up-2 pt-3 border-t border-[#D8E3F0]">
                  <p class="${largeText ? "text-sm sm:text-base" : "text-xs sm:text-[13.5px]"} text-[#051937] leading-relaxed">${slide.coreExplanation}</p>
                </div>
                <div class="anim-slide-up-3 pt-3 border-t border-[#D8E3F0]">
                  <h2 class="text-xs font-semibold uppercase tracking-widest text-[#0052CC]">Actual Issues When Not Planned</h2>
                  <ul class="mt-2 space-y-2">
                    ${slide.actualIssues.map((issue, idx) => `
                      <li class="anim-issue-${idx + 1} flex items-start gap-2.5 ${largeText ? "text-sm" : "text-xs sm:text-[13px]"} text-[#3A3A3C] leading-snug">
                        <span class="font-mono text-xs font-semibold text-[#0052CC] mt-0.5 shrink-0">0${idx + 1}</span>
                        <span>${issue}</span>
                      </li>
                    `).join("")}
                  </ul>
                </div>
              </div>
            </div>

            <div id="right-scroll-col" tabindex="0" class="lg:col-span-7 lg:h-full lg:overflow-y-auto lg:pr-1 flex flex-col justify-between rounded-xl">
              <div class="my-auto py-0.5">
                <section class="anim-stage-in border border-[#D8E3F0] rounded-xl bg-white/45 overflow-hidden flex flex-col">
                  <div class="px-3.5 py-2 border-b border-[#D8E3F0] bg-[#F4F8FD]/55 flex items-center justify-between gap-2">
                    <span class="text-[11px] sm:text-xs font-semibold uppercase tracking-wider text-[#1E3A8A]">Flow Diagram &amp; Step by Step Sequence</span>
                    <span id="step-counter-badge" class="text-[11px] font-mono font-semibold text-[#0052CC]">Step ${selectedStepIdx + 1} of 4 Active</span>
                  </div>

                  <div id="diagram-slot" class="anim-diagram-fade border-b border-[#D8E3F0] w-full bg-[#F4F8FD]/35 px-3.5 py-2 flex items-center justify-center">
                    <div class="w-full max-w-[620px] mx-auto">
                      ${getMermaidSvg(slide.id, selectedStepIdx)}
                    </div>
                  </div>

                  <div id="steps-list" class="divide-y divide-[#D8E3F0] bg-[#F4F8FD]/40">
                    ${renderStepsListHtml(slide)}
                  </div>
                </section>
              </div>
            </div>
          </div>
        `;
        if (resetScroll) {
          const rightCol = document.getElementById("right-scroll-col");
          if (rightCol) rightCol.scrollTop = 0;
        }
      }
    }

    function renderStepsListHtml(slide) {
      return slide.flowToFollow.map((step, idx) => {
        const isSelected = idx === selectedStepIdx;
        return `
          <button type="button" aria-pressed="${isSelected}" onclick="selectStep(${idx})" class="step-row-btn w-full text-left px-3.5 py-2 cursor-pointer flex items-start gap-3 ${isSelected ? "bg-white/65 border-l-4 border-l-[#0052CC]" : "bg-transparent hover:bg-white/45"}">
            <span class="mt-0.5 w-5 h-5 rounded-full text-[10px] font-mono font-semibold flex items-center justify-center shrink-0 transition-all duration-200 ${isSelected ? "bg-[#0052CC] text-white step-badge-active" : "bg-[#EBF3FE]/85 text-[#1E3A8A] border border-[#BFDBFE]"}">${step.stepNumber}</span>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-2">
                <h3 class="text-xs sm:text-[13px] font-semibold text-[#1E3A8A] leading-snug">${step.title}</h3>
                ${isSelected ? "<span class=\"text-[10px] font-mono uppercase tracking-wider font-semibold text-[#0052CC] shrink-0\">Active Node</span>" : ""}
              </div>
              <p class="text-[11.5px] sm:text-xs text-[#334155] leading-snug mt-0.5">${step.action}</p>
              <p class="text-[11px] font-medium text-[#0052CC] leading-snug mt-0.5">→ ${step.preventsIssue}</p>
            </div>
          </button>
        `;
      }).join("");
    }

    function goToNext() {
      if (currentIndex < SLIDES_DATA.length - 1) {
        currentIndex++;
        selectedStepIdx = 0;
        renderApp(true);
      }
    }
    function goToPrev() {
      if (currentIndex > 0) {
        currentIndex--;
        selectedStepIdx = 0;
        renderApp(true);
      }
    }
    function jumpToSlide(idx) {
      currentIndex = idx;
      selectedStepIdx = 0;
      showSlideDrawer = false;
      renderApp(true);
    }
    function toggleSlideDrawer() {
      showSlideDrawer = !showSlideDrawer;
      const drawerEl = document.getElementById("slide-drawer");
      drawerEl.classList.toggle("hidden", !showSlideDrawer);
      const slide = SLIDES_DATA[currentIndex];
      document.getElementById("drawer-toggle-btn").textContent = showSlideDrawer ? "Close All Slides" : `All Slides (${slide.slideNumber}/${SLIDES_DATA.length})`;
    }
    function toggleLargeText() {
      largeText = !largeText;
      document.getElementById("text-size-btn").textContent = "Text Size: " + (largeText ? "Large" : "Standard");
      renderApp(false);
    }
    function selectStep(idx) {
      if (selectedStepIdx === idx) return;
      selectedStepIdx = idx;
      const slide = SLIDES_DATA[currentIndex];
      const badge = document.getElementById("step-counter-badge");
      if (badge) badge.textContent = `Step ${selectedStepIdx + 1} of 4 Active`;
      const diagramSlot = document.getElementById("diagram-slot");
      if (diagramSlot) {
        diagramSlot.classList.remove("anim-diagram-fade");
        void diagramSlot.offsetWidth;
        diagramSlot.innerHTML = `<div class="w-full max-w-[620px] mx-auto">${getMermaidSvg(slide.id, selectedStepIdx)}</div>`;
        diagramSlot.classList.add("anim-diagram-fade");
      }
      const stepsList = document.getElementById("steps-list");
      if (stepsList) {
        stepsList.innerHTML = renderStepsListHtml(slide);
      }
    }
    function toggleCheck(num) {
      checkedItems[num] = !checkedItems[num];
      renderApp(false);
    }
    function toggleAllChecks() {
      const checkedCount = CHECKLIST_QUESTIONS.filter(q => checkedItems[q.num]).length;
      const allDone = checkedCount === 15;
      CHECKLIST_QUESTIONS.forEach(q => { checkedItems[q.num] = !allDone; });
      renderApp(false);
    }
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      } else {
        document.exitFullscreen?.().catch(() => {});
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown") goToNext();
      else if (e.key === "ArrowLeft" || e.key === "PageUp") goToPrev();
      else if (e.key === "Home") { e.preventDefault(); jumpToSlide(0); }
      else if (e.key === "End") { e.preventDefault(); jumpToSlide(SLIDES_DATA.length - 1); }
      else if (e.key === "Escape" && showSlideDrawer) toggleSlideDrawer();
    });

    renderApp(true);
  </script>
</body>
</html>
