            <text x="400" y="60" text-anchor="middle" font-size="10" font-weight="600" fill="white">3. Business Math</text>

        case 'topic-14-documentation':

            <rect x="20" y="30" width="180" height="150" rx="6" fill="#FFFFFF" stroke="#1C1917" stroke-width="1.5" />
            <rect x="32" y="42" width="156" height="24" rx="4" fill="#1C1917" />
            <text x="110" y="58" text-anchor="middle" class="text-[10px] font-semibold fill-white">1. One-Page README</text>

            <text x="35" y="112" class="text-[10px] fill-[#44403C]">• How to open or run it</text>

            <text x="35" y="160" class="text-[9.5px] font-semibold fill-[#14532D]">Takes 10 mins to read</text>

            <rect x="230" y="30" width="180" height="150" rx="6" fill="#FFFFFF" stroke="#1C1917" stroke-width="1.5" />
            <rect x="242" y="42" width="156" height="24" rx="4" fill="#1C1917" />
            <text x="320" y="58" text-anchor="middle" class="text-[10px] font-semibold fill-white">2. Account Checklist</text>
            <text x="245" y="90" class="text-[10px] fill-[#44403C]">• List required services</text>
            <text x="245" y="112" class="text-[10px] fill-[#44403C]">• Template variable names</text>
            <text x="245" y="134" class="text-[10px] fill-[#44403C]">• Zero secrets pasted inside</text>
            <text x="245" y="160" class="text-[9.5px] font-semibold fill-[#14532D]">Prevents setup crashes</text>

            <rect x="440" y="30" width="180" height="150" rx="6" fill="#FFFFFF" stroke="#1C1917" stroke-width="1.5" />

            <text x="530" y="58" text-anchor="middle" class="text-[10px] font-semibold fill-white">3. Status Sheet</text>
            <text x="455" y="90" class="text-[10px] fill-[#44403C]">• What is finished today</text>
            <text x="455" y="112" class="text-[10px] fill-[#44403C]">• What is saved for V2</text>
            <text x="455" y="134" class="text-[10px] fill-[#44403C]">• Known constraints &amp; edge cases</text>

        case 'topic-15-review':
          return `<svg viewBox="0 0 640 210" class="${svgClass}" fill="none">
            <rect x="30" y="25" width="320" height="160" rx="8" fill="#FFFFFF" stroke="#1C1917" stroke-width="1.5" />

            <text x="50" y="112" class="text-[10.5px] fill-[#14532D] font-bold">✓ 2. Version 1 Scope locked (V2 ideas parked)</text>
            <text x="50" y="136" class="text-[10.5px] fill-[#14532D] font-bold">✓ 3. Data fields, dates &amp; rules standardized</text>

            <g transform="translate(390, 35)">
              <rect x="0" y="0" width="220" height="140" rx="10" fill="#14532D" fill-opacity="0.08" stroke="#14532D" stroke-width="2" />

            </g>
          </svg>`;

        case 'process-summary':
          return `<svg viewBox="0 0 640 210" class="${svgClass}" fill="none">
            ${[
              { x: 14, phase: 'PHASE 1: DEFINE', items: ['01. The Idea', '02. The Problem', '03. Target Users', '04. V1 Boundaries'] },
              { x: 170, phase: 'PHASE 2: SHAPE', items: ['05. User Steps', '06. Clean UI', '07. Standard Data', 'Error Recovery'] },
              { x: 326, phase: 'PHASE 3: PROTECT', items: ['08. Security Gate', '09. File Exports', '10. Phone Layout', '11. AI Verification'] },

            ].map((p, idx) => `
              <g>

                <text x="${p.x + 72}" y="44" text-anchor="middle" class="text-[10px] font-mono font-semibold fill-[#FBF9F5]">${p.phase}</text>

                  <rect x="${p.x + 10}" y="${66 + j * 28}" width="124" height="20" rx="4" fill="#F2EFE9" />

                ${idx < 3 ? `<line x1="${p.x + 144}" y1="105" x2="${p.x + 156}" y2="105" stroke="#1C1917" stroke-width="2" />` : ''}

        case 'closing':
          return `<svg viewBox="0 0 640 210" class="${svgClass}" fill="none">
            <rect x="30" y="25" width="580" height="160" rx="10" fill="#1C1917" />
            <text x="320" y="65" text-anchor="middle" class="text-[18px] font-serif font-bold fill-[#FBF9F5]">Plan First. Build Second.</text>
            <line x1="160" y1="85" x2="480" y2="85" stroke="#57534E" stroke-width="1" />
            <text x="320" y="112" text-anchor="middle" class="text-[11.5px] fill-[#E7E5E4]">A short 1-page specification saves weeks of expensive rebuilds.</text>
            <text x="320" y="132" text-anchor="middle" class="text-[11.5px] fill-[#E7E5E4]">Clear instructions let both AI and human developers build tools that actually last.</text>
            <g transform="translate(240, 146)">
              <rect x="0" y="0" width="160" height="26" rx="13" fill="#14532D" />

        default:
          return '';

    }

    function renderApp() {
      const totalSlides = SLIDES_DATA.length;
      const slide = SLIDES_DATA[currentIndex];

      // Screen reader announcement
      document.getElementById('sr-announcer').textContent = `Slide ${slide.slideNumber} of ${totalSlides}: ${slide.title}`;

      // Drawer toggle label
      document.getElementById('drawer-toggle-btn').textContent = showSlideDrawer ? 'Close Slides ✕' : `All 20 Slides (${slide.slideNumber}/${totalSlides})`;
      document.getElementById('drawer-toggle-btn').setAttribute('aria-expanded', showSlideDrawer);

      // Bottom bar text and progress bar
      document.getElementById('slide-progress-text').textContent = `Slide ${slide.slideNumber} of ${totalSlides}`;
      const pct = Math.round(((currentIndex + 1) / totalSlides) * 100);
      document.getElementById('slide-progress-bar').style.width = pct + '%';

      // Previous button state
      document.getElementById('prev-btn').disabled = currentIndex === 0;

      // Next button text
      const nextBtn = document.getElementById('next-btn');
      if (currentIndex < totalSlides - 1) {
        nextBtn.textContent = 'Next →';
        nextBtn.onclick = goToNext;
      } else {
        nextBtn.textContent = 'Start Over ↺';
        nextBtn.onclick = () => jumpToSlide(0);
      }

      // Top nav active states
      document.getElementById('nav-intro').className = `hover:text-[#1C1917] transition-colors whitespace-nowrap shrink-0 cursor-pointer ${currentIndex <= 1 ? 'text-[#1C1917] font-semibold underline underline-offset-8 decoration-2' : ''}`;
      document.getElementById('nav-topics').className = `hover:text-[#1C1917] transition-colors whitespace-nowrap shrink-0 cursor-pointer ${currentIndex >= 2 && currentIndex <= 16 ? 'text-[#1C1917] font-semibold underline underline-offset-8 decoration-2' : ''}`;
      document.getElementById('nav-flow').className = `hover:text-[#1C1917] transition-colors whitespace-nowrap shrink-0 cursor-pointer ${currentIndex === 17 ? 'text-[#1C1917] font-semibold underline underline-offset-8 decoration-2' : ''}`;
      document.getElementById('nav-check').className = `hover:text-[#1C1917] transition-colors whitespace-nowrap shrink-0 cursor-pointer ${currentIndex >= 18 ? 'text-[#1C1917] font-semibold underline underline-offset-8 decoration-2' : ''}`;

      // Slide drawer grid
      const drawerEl = document.getElementById('slide-drawer');
      drawerEl.classList.toggle('hidden', !showSlideDrawer);
      document.getElementById('slide-drawer-grid').innerHTML = SLIDES_DATA.map((item, idx) => `
        <button type="button" onclick="jumpToSlide(${idx})" class="p-2.5 text-left rounded-lg border transition-all cursor-pointer ${idx === currentIndex ? 'bg-[#1C1917] text-[#FBF9F5] border-[#1C1917] shadow-sm' : 'bg-[#FBF9F5] text-[#1C1917] border-[#E5E0D8] hover:border-[#78716C]'}">
          <div class="text-[10.5px] font-mono tabular-nums opacity-75">${item.slideNumber} · ${item.section}</div>
          <div class="text-xs font-semibold mt-0.5 truncate">${item.title}</div>
        </button>
      `).join('');

      // Main stage rendering
      const container = document.getElementById('slide-container');

      if (slide.id === 'final-checklist') {
        const checkedCount = CHECKLIST_QUESTIONS.filter(q => checkedItems[q.num]).length;
        container.innerHTML = `
          <div class="flex-1 min-h-0 flex flex-col space-y-4 lg:h-full lg:overflow-hidden">
            <!-- Pinned Checklist Header -->
            <div class="shrink-0 flex flex-wrap items-end justify-between gap-4 pb-3 border-b border-[#E5E0D8]">
              <div>
                <div class="text-xs font-medium uppercase tracking-widest text-[#78716C]">Slide ${slide.slideNumber} of ${totalSlides} · ${slide.section}</div>
                <h1 class="mt-1 text-2xl sm:text-3xl font-display font-medium tracking-tight text-[#1C1917]">${slide.title}</h1>
                <p class="mt-1 text-xs sm:text-sm text-[#57534E]">${slide.subtitle}</p>
              </div>
              <div class="flex items-center gap-3 shrink-0">
                <span class="text-xs sm:text-sm font-mono tabular-nums font-semibold text-[#14532D]">${checkedCount} of 15 Confirmed</span>
                <button type="button" onclick="toggleAllChecks()" class="min-h-[36px] px-3.5 py-1.5 text-xs font-medium border border-[#D6D0C4] rounded-lg hover:bg-[#F2EFE9] transition-colors cursor-pointer whitespace-nowrap">
                  ${checkedCount === 15 ? 'Reset All' : 'Confirm All 15'}
                </button>
              </div>
            </div>

            <!-- Scrollable Checklist Grid (Clean stage scrolling without layout jitter) -->
            <div id="checklist-scroll-container" class="flex-1 min-h-0 overflow-y-auto pr-1 sm:pr-2 custom-scrollbar">
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 pb-2">
                ${CHECKLIST_QUESTIONS.map(item => {
                  const isDone = !!checkedItems[item.num];
                  return `
                    <button type="button" onclick="toggleCheck('${item.num}')" class="p-3.5 rounded-lg border text-left flex items-start gap-3 transition-colors cursor-pointer ${isDone ? 'bg-[#14532D]/[0.05] border-[#14532D]/40' : 'bg-white border-[#E5E0D8] hover:border-[#A8A29E]'}">
                      <span class="mt-0.5 w-4 h-4 rounded border flex items-center justify-center text-[10px] font-bold shrink-0 ${isDone ? 'bg-[#14532D] border-[#14532D] text-white' : 'border-[#78716C] bg-[#FBF9F5]'}">${isDone ? '✓' : ''}</span>
                      <div class="flex-1 min-w-0">
                        <div class="text-xs font-semibold text-[#1C1917]">${item.num}. ${item.topic}</div>
                        <p class="text-xs text-[#44403C] leading-snug mt-1">${item.question}</p>
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 xl:gap-10 lg:h-full lg:overflow-hidden items-start">
            <!-- Left Column: Functional Scope & Requirements (Pinned & Visible) -->
            <div id="left-info-pane" class="lg:col-span-6 space-y-4 lg:space-y-5 lg:h-full lg:overflow-hidden flex flex-col justify-start">
              <div>
                <div class="flex items-center gap-2 text-xs font-medium uppercase tracking-widest text-[#78716C]">
                  <span class="font-mono tabular-nums font-semibold text-[#9A3412]">Slide ${slide.slideNumber} of ${totalSlides}</span>
                  <span>·</span>
                  <span>${slide.section}</span>
                </div>
                <h1 class="mt-2 text-2xl sm:text-3xl lg:text-[2.25rem] font-display font-medium tracking-tight text-[#1C1917] leading-[1.2]">
                  ${slide.topicNumber ? `${slide.topicNumber}. ${slide.title}` : slide.title}
                </h1>
                <p class="mt-2 text-base sm:text-lg font-medium text-[#57534E] leading-relaxed">${slide.subtitle}</p>
              </div>

              <div class="pt-4 border-t border-[#E5E0D8]">
                <p class="text-sm sm:text-base text-[#1C1917] leading-relaxed">${slide.coreExplanation}</p>
              </div>

              ${slide.actualIssues && slide.actualIssues.length > 0 ? `
                <div class="pt-4 border-t border-[#E5E0D8]">
                  <h2 class="text-xs font-semibold uppercase tracking-widest text-[#9A3412]">Operational Risks Mitigated</h2>
                  <ul class="mt-3 space-y-2.5">
                    ${slide.actualIssues.map((issue, idx) => `
                      <li class="flex items-start gap-3 text-xs sm:text-sm text-[#44403C] leading-relaxed">
                        <span class="font-mono text-xs font-semibold text-[#9A3412] mt-0.5 shrink-0">0${idx + 1}</span>
                        <span>${issue}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>
              ` : ''}
            </div>

            <!-- Right Column: Tailored Visualization & Steps (Independent Vertical Scroll) -->
            <div id="right-viz-pane" class="lg:col-span-6 space-y-4 lg:h-full lg:overflow-y-auto lg:pr-2.5 custom-scrollbar">
              <!-- Visual Card (Clean Architecture SVG) -->
              <div class="border border-[#D6D0C4] rounded-xl bg-[#F7F4EE] overflow-hidden shadow-sm p-3 flex items-center justify-center shrink-0">
                ${getSlideSvg(slide.id)}
              </div>

              <!-- Implementation Steps & Guardrails -->
              ${slide.flowToFollow && slide.flowToFollow.length > 0 ? `
                <div class="border border-[#D6D0C4] rounded-xl bg-white overflow-hidden shadow-sm divide-y divide-[#E5E0D8]">
                  <div class="px-4 py-2 bg-[#F7F4EE] border-b border-[#E5E0D8] text-xs font-semibold uppercase tracking-wider text-[#1C1917]">
                    Implementation Steps &amp; Guardrails
                  </div>
                  ${slide.flowToFollow.map((step, idx) => {
                    const isSelected = idx === selectedStepIdx;
                    return `
                      <button type="button" onclick="selectStep(${idx})" class="w-full text-left px-4 py-2.5 transition-colors cursor-pointer flex items-start gap-3 ${isSelected ? 'bg-[#FBF9F5] shadow-[inset_2px_0_0_#1C1917]' : 'hover:bg-[#FBF9F5]/70'}">
                        <span class="mt-0.5 w-5 h-5 rounded-full text-[11px] font-mono font-semibold flex items-center justify-center shrink-0 ${isSelected ? 'bg-[#1C1917] text-[#FBF9F5]' : 'bg-[#F2EFE9] text-[#57534E] border border-[#D6D0C4]'}">${step.stepNumber}</span>
                        <div class="flex-1 min-w-0">
                          <h3 class="text-xs sm:text-sm font-semibold text-[#1C1917]">${step.title}</h3>
                          <p class="text-xs text-[#44403C] leading-snug mt-0.5">${step.action}</p>
                          <p class="text-[11px] font-medium text-[#14532D] mt-0.5">Benefit: ${step.preventsIssue}</p>
                        </div>
                      </button>
                    `;
                  }).join('')}
                </div>
              ` : ''}
            </div>
          </div>
        `;

        // Wire mouse wheel over pinned left pane to scroll the right pane on desktop viewports
        const leftPane = document.getElementById('left-info-pane');
        const rightPane = document.getElementById('right-viz-pane');
        if (leftPane && rightPane) {
          leftPane.addEventListener('wheel', (e) => {
            if (window.innerWidth >= 1024) {
              rightPane.scrollTop += e.deltaY;
            }
          }, { passive: true });
        }
      }
    }

    function goToNext() {
      if (currentIndex < SLIDES_DATA.length - 1) {
        currentIndex++;
        selectedStepIdx = 0;
        renderApp();
      }
    }

    function goToPrev() {
      if (currentIndex > 0) {
        currentIndex--;
        selectedStepIdx = 0;
        renderApp();
      }
    }

    function jumpToSlide(idx) {
      currentIndex = idx;
      selectedStepIdx = 0;
      showSlideDrawer = false;
      renderApp();
    }

    function toggleSlideDrawer() {
      showSlideDrawer = !showSlideDrawer;
      renderApp();
    }

    function selectStep(idx) {
      selectedStepIdx = idx;
      const rightPane = document.getElementById('right-viz-pane');
      const prevScroll = rightPane ? rightPane.scrollTop : 0;
      renderApp();
      const newRightPane = document.getElementById('right-viz-pane');
      if (newRightPane) {
        newRightPane.scrollTop = prevScroll;
      }
    }

    function toggleCheck(num) {
      checkedItems[num] = !checkedItems[num];
      const checklistScroll = document.getElementById('checklist-scroll-container');
      const prevScroll = checklistScroll ? checklistScroll.scrollTop : 0;
      renderApp();
      const newChecklistScroll = document.getElementById('checklist-scroll-container');
      if (newChecklistScroll) {
        newChecklistScroll.scrollTop = prevScroll;
      }
    }

    function toggleAllChecks() {
      const checkedCount = CHECKLIST_QUESTIONS.filter(q => checkedItems[q.num]).length;
      const allDone = checkedCount === 15;
      CHECKLIST_QUESTIONS.forEach(q => { checkedItems[q.num] = !allDone; });
      const checklistScroll = document.getElementById('checklist-scroll-container');
      const prevScroll = checklistScroll ? checklistScroll.scrollTop : 0;
      renderApp();
      const newChecklistScroll = document.getElementById('checklist-scroll-container');
      if (newChecklistScroll) {
        newChecklistScroll.scrollTop = prevScroll;
      }
    }

    // Keyboard support: Left/Right arrows, Spacebar, Escape
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && !showSlideDrawer)) {
        e.preventDefault();
        goToNext();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        goToPrev();
      } else if (e.key === 'Escape' && showSlideDrawer) {
        toggleSlideDrawer();
      }
    });

    renderApp();
  </script>
</body>
